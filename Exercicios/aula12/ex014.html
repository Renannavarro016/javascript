<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto Relógio</title>
    <link rel="shortcut icon" href="Stim 1.png" type="image/x-icon">
    <script src="https://kit.fontawesome.com/19d3b07e42.js" crossorigin="anonymous"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }

        h1 {
            padding: 30px;
            text-align: center;
            font-size: 2.5em;
            color: white;
        }

        main {
            display: block;
            margin: auto;
            margin-top: 75px;
            padding: 40px;
            background-color: white;
            width: fit-content;
            border-radius: 20px;
            box-shadow: 1px 2px 2px 1px rgba(0, 0, 0, 0.308);
        }

        .box {
            display: flex;
            justify-content: center;
            text-align: center;
            flex-direction: column;
        }

        .box #res {
            font-size: 1.5em;
            margin-bottom: 35px;
        }

        .box #res p {
            margin: 5px;
        }

        .box .foto {
            aspect-ratio: 1/1;
            border-radius: 50%;
            width: 55%;
            border: 2px solid white;
            outline: 2px solid rgb(255, 68, 0);
            transition: transform .5s;
        }

        .box .foto:hover {
            transform: translateY(-1px);
        }

        a {
            display: flex;
            justify-content: center;
            text-align: center;
            margin: auto;
            width: fit-content;
            height: 5px;
            padding: 30px;
            font-size: 1.1em;
            font-weight: 700;
            color: white;
            text-decoration: none;
            transition: color .5s;
        }

        a:hover {
            color: rgba(255, 255, 255, 0.329);
        }

        @media screen and (max-width: 768px) {  
            h1 {
                margin-bottom: 75px;
            }

            main {
                margin-bottom: 25px;
                width: 380px;
            }

            .box .foto {
                margin: 15px;
                width: 80%;
            }

            div p {
                font-size: .9em;
            }
        }
    </style>
</head>
<body>
    <h1>Hora do dia <i class="fa-solid fa-clock"></i></h1>
    <main>
        <section class="box">
            <div id="res">
            </div>
            <div id="ft">
            </div>
        </section>
    </main>
    <a href="https://www.instagram.com/renan_navarro15/">© Renan Navarro</a>
    <script>
        var hora = new Date().getHours()
        var min = new Date().getMinutes()
        var res = document.querySelector('div#res')
        var b = document.querySelector('body')
        var img = document.querySelector('div#ft')
        if (hora <= 5) {
            res.innerHTML = `<p>Agora são ${hora}:${min} da madrugada <i class="fa-solid fa-cloud-moon"></i><p>`
                b.style.backgroundImage = 'linear-gradient(90deg, rgba(39, 39, 39, 0.829), rgba(0, 0, 0, 0.925))'
                img.innerHTML = '<img src="https://img.freepik.com/fotos-premium/trafego-urbano_271102-52.jpg" alt="foto" class="foto">'
        } else if (hora < 12) {
            res.innerHTML = `<p>Agora são ${hora}:${min} da manhã <i class="fa-solid fa-sun"></i>`
                b.style.backgroundImage = 'linear-gradient(90deg, rgb(148, 184, 250), rgb(255, 239, 151))'
                img.innerHTML = '<img src="https://img.freepik.com/fotos-gratis/vista-inspiradora-da-luz-da-manha_23-2148851773.jpg" alt="foto" class="foto">'
        } else if (hora >= 12 && hora < 18) {
            res.innerHTML = `<p>Agora são ${hora}:${min} da tarde <i class="fa-solid fa-cloud-sun"></i>`
                b.style.backgroundImage = 'linear-gradient(90deg, rgba(189, 91, 56, 0.911), rgb(85, 43, 10))'
                img.innerHTML = '<img src="https://videocdn.cdnpk.net/videos/0028826a-b358-50da-914d-6f12d070953b/horizontal/thumbnails/small.jpg" alt="foto" class="foto">'
        } else if (hora >= 18) {
            res.innerHTML = `<p>Agora são ${hora}:${min} da noite <i class="fa-solid fa-moon"></i>`
                b.style.backgroundImage = 'linear-gradient(90deg, rgb(1, 1, 18), rgb(56, 56, 85))'
                img.innerHTML = '<img src="https://media.istockphoto.com/id/1154975453/pt/foto/estaiadas-bridge-night-aerial-view-s%C3%A3o-paulo-brazil-business-center-financial-center-great.jpg?s=612x612&w=0&k=20&c=n35iXQqYHNJT2AfL9nOpQ-TDM_nsJyJhI8-lRKD_3aw=" alt="foto" class="foto">'
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificador de Idade</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: rgb(57, 57, 206);
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            font-weight: 600;
            transition: all .5s;
        }

        h1 {
            position: relative;
            display: flex;
            justify-content: center;
            text-align: center;
            top: 100px;
        }

        main {
            display: flex;
            justify-content: center;
            padding: 200px;
            transition: .5s;
        }

        #form {
            padding: 10px;
            gap: 10px;
            background-color: white;
            color: black;
            border-radius: 15px;
            box-shadow: 2px 2px 2px 3px black;
            transition: .5s;
        }

        #form p {
            padding: 7px;
            margin: 5px;
            gap: 10px;
        }

        #form p .anos {
            padding: 2px;
            margin: 5px;
            border-radius: 10px;
            transition: transform .5s;
        }

        #form .btn {
            margin: 10px;
            padding: 10px;
            border-radius: 12px;
            border: none;
            background-image: linear-gradient(90deg, rgb(89, 89, 219), rgb(164, 164, 243));
            color: white;
            transition: transform .5s, box-shadow .5s;
        }


        #form .btn:hover {
            transform: scale(1.06);
            box-shadow: 2px 2px 2px 1px rgba(0, 0, 0, 0.205);
        }

        #form #resultado {
            font-weight: 500;
            display: flex;
            justify-content: center;
            margin: 10px;
            padding: 10px;
        }

        #form .foto {
            display: block;
            margin: auto;
            width: 50%;
            border-radius: 50%;
            transition: transform .5s, box-shadow .5s;
        }

        #form .foto:hover {
            transform: translateY(-3px);
            box-shadow: 1px 2px 2px 2px rgba(0, 0, 0, 0.315);
        }

        #form hr {
            display: block;
            margin: auto;
            width: 90%;
        }

        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
        }

        a {
            position: relative;
            bottom: 60px;
            left: 9px;
            display: block;
            margin: auto;
            font-size: 13px;
            text-decoration: none;
            color: white;
            transition: color .5s;
            width: fit-content;
        }

        a:hover {
            color: rgba(255, 255, 255, 0.308);
        }

        a img {
            position: relative;
            bottom: -3px;
        }

        @media screen and (max-width: 878px){
            #form  p {
                font-size: 13px;
            }

            #form .anos {
                width: fit-content;
                height: 25px;
            }

            #form input .sex {
                width: 80px;
            }
        }
    </style>
</head>
<body>
    <h1>Verifique a sua idade 🎗️</h1>
    <main>
        <div id="form">
            <p>Ano de Nascimento: <input type="number" name="ano" id="ano" class="anos"></p>
            <p class="sex">Sexo:   
            <input type="radio" name="sexo" class="man"> Homemㅤ<input type="radio" name="sexo" class="wom"> Mulher
            </p>
            <input type="button" value="Verificar" onclick="checar()" class="btn">
            <br><br><br>
            <hr>
            <br>
            <div id="resultado"></div>
            <div>
                <img id="foto" class="foto">
            </div>
            <br>
        </div>
    </main>
    <a href="https://www.instagram.com/renan_navarro15/" target="_blank">© Renan Navarro <img src="https://img.icons8.com/?size=100&id=85154&format=png&color=ffffff" alt="" width="17px" height="17px"></a>
    
    <script>
        function checar() {
            let ano = new Date().getFullYear()
            var idd = document.getElementById('ano').value
            var Homem = document.querySelector('.man').checked
            var Mulher = document.querySelector('.wom').checked
            var img = document.querySelector('#foto')
            var resp = document.querySelector('div#resultado')

            var idade = ano-idd
            
            if (Homem) {
                Homem = 'Homem'
                resp.innerHTML = `<p>Você é um <strong> ${Homem} </strong> e tem <strong>${idade}</strong> anos.</p>`
                img.src = 'imagens/homem.png'

                if (idade <= 2) {
                    Homem = 'Criança'
                    resp.innerHTML = `<p>Você é uma <strong> ${Homem} </strong> e tem <strong>${idade}</strong> anos.</p>`
                    img.src = 'imagens/crianca de 2 anos.jpg'
                } else if (idade <= 5) {
                    Homem = 'Criança'
                    resp.innerHTML = `<p>Você é uma <strong> ${Homem} </strong> e tem <strong>${idade}</strong> anos.</p>`
                    img.src = 'imagens/crianca de 5 anos.jpg'
                } else if (idade < 10) {
                    Homem = 'Criança'
                    resp.innerHTML = `<p>Você é uma <strong> ${Homem} </strong> e tem <strong>${idade}</strong> anos.</p>`
                    img.src = 'imagens/crianca de 10 anos.jpg'
                } else if (idade >= 10 && idade <= 15) {
                    Homem = 'Menino'
                    resp.innerHTML = `<p>Você é um <strong> ${Homem} </strong> e tem <strong>${idade}</strong> anos.</p>`
                    img.src = 'imagens/homem de 15 anos.png'
                } else if (idade > 15 && idade <= 21) {
                    `<p>Você é um <strong> ${Homem} </strong> e tem <strong>${idade}</strong> anos.</p>`
                    img.src = 'imagens/homem de 21 anos.png'
                } else if (idade >= 30 && idade < 40) {
                    `<p>Você é um <strong> ${Homem} </strong> e tem <strong>${idade}</strong> anos.</p>`
                    img.src = 'imagens/homem de 35 anos.png'
                } else if (idade >= 40 && idade < 60) {
                    `<p>Você é um <strong> ${Homem} </strong> e tem <strong>${idade}</strong> anos.</p>`
                    img.src = 'imagens/homem de 50 anos.jpg'
                } else if (idade >= 60 && idade < 90) {
                   `<p>Você é um <strong> ${Homem} </strong> e tem <strong>${idade}</strong> anos.</p>`
                    img.src = 'imagens/homem de 70 anos.jpg'
                } else if (idade >= 90) {
                    resp.innerHTML = `<p>Você é um <strong> ${Homem} </strong> e tem <strong>${idade}</strong> anos. Parabéns, você recebeu a benção da longevidade de Deus!</p>`
                    img.src = 'imagens/homem de 90 anos.jpg'
                }
            } 
            
            if (Mulher) {
                Mulher = 'Mulher'
                resp.innerHTML = `<p>Você é uma <strong>${Mulher}</strong> e tem <strong> ${idade} </strong> anos.</p>`
                img.src = 'imagens/mulher.jpg'
                
                if (idade <= 2) {
                    Mulher = 'Criança'
                    resp.innerHTML = `<p>Você é uma <strong>${Mulher}</strong> e tem <strong> ${idade} </strong> anos.</p>`
                    img.src = 'imagens/menina de 2 anos.png'
                } else if (idade <= 5) {
                    Mulher = 'Criança'
                    resp.innerHTML = `<p>Você é uma <strong>${Mulher}</strong> e tem <strong> ${idade} </strong> anos.`
                    img.src = 'imagens/menina de 5 anos.jpg'
                } else if (idade < 10) {
                    Mulher = 'Menina'
                    resp.innerHTML = `<p>Você é uma <strong> ${Mulher} </strong> e tem <strong> ${idade} </strong> anos.</p>`
                    img.src = 'imagens/menina de 10 anos.jpg'
                } else if (idade >= 10 && idade <= 15) {
                    Mulher = 'Menina'
                    resp.innerHTML = `<p>Você é um <strong> ${Mulher} </strong> e tem <strong> ${idade} </strong> anos.</p>`
                    img.src = 'imagens/mulher de 15 anos.jpg'
                } else if (idade > 15 && idade <= 21) {
                    resp.innerHTML = `<p>Você é uma <strong> ${Mulher} </strong> e tem <strong>${idade}</strong> anos.</p>`
                    img.src = 'imagens/mulher de 21 anos.jpg'
                } else if (idade >= 30 && idade <= 40) {
                    resp.innerHTML = `<p>Você é um <strong> ${Mulher} </strong> e tem <strong>${idade}</strong> anos.</p>`
                    img.src = 'imagens/mulher de 35 anos.png'
                } else if (idade > 40 && idade < 60) {
                    resp.innerHTML = `<p>Você é um <strong> ${Mulher} </strong> e tem <strong>${idade}</strong> anos.</p>`
                    img.src = 'imagens/mulher de 50 anos.png'
                } else if (idade >= 60 && idade <= 90) {
                    resp.innerHTML = `<p>Você é um <strong> ${Mulher} </strong> e tem <strong>${idade}</strong> anos.</p>`
                    img.src = 'imagens/mulher de 70 anos.jpg'
                } else if (idade > 90) {
                    resp.innerHTML = `<p>Você é uma <strong> ${Mulher} </strong> e tem <strong>${idade}</strong> anos. Parabéns, você recebeu a benção da longevidade de Deus!</p>`
                    img.src = 'imagens/mulher de 90 anos.png'
                } 
            }
        }
    </script>
</body>
</html>

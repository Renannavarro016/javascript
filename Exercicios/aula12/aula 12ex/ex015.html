<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="ex015.js"></script>
    <title>Verificador de Idade</title>
</head>

<body>
    <header>
        <!-- Titulo -->
        <h1>Verifique a sua idade 🎗️</h1>
    </header>

    <main>
        <!-- Caixa -->
        <div id="form">

            <!-- Data -->
            <p>
            Ano de Nascimento: 
            <input type="number" name="ano" id="ano" class="anos">
            </p>

            <!-- Escolha de gênero -->
            <p class="sex">
            Sexo:   
            <input type="radio" name="sexo" class="man"> Homemㅤ
            <input type="radio" name="sexo" class="wom"> Mulher
            </p>

            <!-- Botão -->
            <input type="button" value="Verificar" onclick="checar()" class="btn">
            <br><br><br> 
            
            <hr>
            
            <!-- Aparece a resposta do user -->
            <br>
            <div id="resultado"></div>

            <!-- Imagens referente a reposta -->
            <div>
                <img id="foto" class="foto">
            </div>
            <br>

        </div>
    </main>

    <footer>
        <!-- Créditos -->
        <a href="https://www.instagram.com/renan_navarro15/" target="_blank">© Renan Navarro <img src="https://img.icons8.com/?size=100&id=85154&format=png&color=ffffff" alt="" width="15px" height="15px">
        </a>
    </footer>
 
</body>
</html>

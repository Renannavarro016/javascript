<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-size: 2em;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>
    <script>
        let nome = window.prompt('Qual é o seu nome?')
        document.write(`O nome ${nome} tem ${nome.length} letras.<br><br>`) // quantidade de caracteres
        document.write(`Seu nome em maiúsculo: ${nome.toUpperCase()}<br><br>`)  // nome em maiúsculo
        document.write(`Seu nome em minúsculo: ${nome.toLowerCase()}`) // nome em minúsculo
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
    <title>Contador de Passos</title>
</head>
<body>
    <header>
        <h1>Contador de Passos</h1>
    </header>
    <br>
    <section>
        <div>
            <p>Início</p>
            <input type="number" name="ini" id="ini" placeholder="Começo">
            <p>Fim</p>
            <input type="number" name="fim" id="fim" placeholder="Final">
            <p>Passo</p>
            <input type="number" name="pss" id="pss" placeholder="Pulos"><br><br>
            <input class="btn" type="button" value="Confirmar" onclick="contar()">
        </div>
        <br>
        <div class="res">
            <p>Processando...</p>
        </div>
    </section>
    <footer>
        <a href="#">Renan Navarro</a>
    </footer>
</body>
</html>

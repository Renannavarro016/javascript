<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cálculo em Produtos</title>
    <style>
        body {
            font-size: .9em;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            margin: 15px;
        }

        h1 {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        input {
            width: 25%;
            padding: 5px;
            margin: 5px;
            background-color: rgb(116, 158, 235);
            border-radius: 10px;
            border-color: black;
            color: white;
        }

        .botao {
            background-color: black;
            border-radius: 7px;
            width: 80px;
            height: 35px;
            margin: 20px;
            font-weight: bolder;
            transition: background-color .5s;
        }

        .botao:hover {
            background-color: rgba(0, 0, 0, 0.658);
        }

        #res, #res2 {
            display: block;
            margin: auto;
            position: absolute;
            left: 12px;
            margin-top: 200px;
            padding: 10px;
            background-color: cornsilk;
            width: 280px;
            border-radius: 10px;
            border: 1px solid black;
            margin-left: 10px;
            font-weight: 500;
        }

        #tabela, #tabela2 {
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 10px;
            background-color: rgba(169, 169, 169, 0.637);
            border-radius: 10px;
            height: 280px;
            box-shadow: 1px 2px 2px 1px rgba(0, 0, 0, 0.425);
        }

        #tabela h2 {
            position: absolute;
            top: 170px;
            left: auto;
        }

        #tabela2 h2 {
            position: absolute;
            top: 490px;
            left: auto;
        }

        p {
            font-weight: bolder;
            font-size: .8em;
        }
    </style>
</head>
<body>
    <h1>Cálculo de porcentagem % de um produto 🛒📦</h1>
    <br>
    <br>
    <div id="tabela">
        <h2>Desconto 📉</h2>
        <p>Preço $</p>
        <input type="number" name="preco" id="preco" >
        <p>Desconto %</p>
        <input type="number" name="desconto" id="desconto">
        <input type="button" value="Calcular" onclick="calcularDesc()" class="botao">
        <div id="res">Resultado</div>
    </div>
    <br>
     <div id="tabela2">
        <h2>Aumento 📈</h2>
        <p>Valor $</p>
        <input type="number" name="valor" id="valor" >
        <p>Aumento %</p>
        <input type="number" name="aumento" id="aumento">
        <input type="button" value="Calcular" onclick="calcularAume()" class="botao">
        <div id="res2">Resultado</div>
    </div>

    <script>
        function calcularDesc() {
            var p = Number.parseFloat(document.getElementById('preco').value)
            var d = Number.parseFloat(document.getElementById('desconto').value)
            var res = document.querySelector('div#res')
            res.innerHTML = `A sua compra no valor de <strong>${p},00$</strong> com um desconto de <strong>${d}%</strong> passará a ter o valor de <strong>` + Number.parseFloat(p-(p*d/100)) + '$</strong> em sua compra!'
        }

        function calcularAume() {
            var v = Number.parseFloat(document.getElementById('valor').value)
            var a = Number.parseFloat(document.getElementById('aumento').value)
            var res2 = document.querySelector('div#res2')
            res2.innerHTML = `O produto ou salário com um valor de <strong>${v}$</strong> com um aumento de <strong>${a}%</strong> passará a ter o valor de <strong>` + Number.parseFloat(v+(v*a/100)) + '$</strong>'
        }
    </script>
</body>
</html>
